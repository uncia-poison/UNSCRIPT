[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unscript"
version = "0.3.1"
description = "Bilingual model voice autonomy, anti-cliché auditing and conservative middleware"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "uncia-poison"}]
dependencies = []

[project.scripts]
unscript = "unscript.__main__:main"
speech987 = "speech987.__main__:main"

[tool.setuptools.packages.find]
include = ["unscript*", "speech987*"]
